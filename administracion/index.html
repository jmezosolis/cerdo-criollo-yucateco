<style>
/* Bordes en azul marino (marca GanaID, la misma que usa el sitio) acá
— mismo grosor y mismo lugar que shared/styles.css, solo
cambia el color del filo, pisando los tokens de borde de "theme-bw"
nada más para esta página. */
body.theme-bw{
--borde: rgba(15,42,74,0.30);
--borde-suave: rgba(15,42,74,0.18);
--borde-fuerte: rgba(15,42,74,0.4);
--borde-dorado: rgba(15,42,74,0.55);
--borde-dorado-suave: rgba(15,42,74,0.75);
}
/* Franja fija para la barra de actividades del admin (Resumen,
Pendientes, Monitoreo, Usuarios, etc.): en mobile el <aside
class="sidebar"> (donde vive la barra de pestañas) no es "sticky"
-eso arranca recién en pantallas de PC, ver shared/styles.css-, así
que al bajar en una sección larga la barra se perdía de vista y había
que volver a subir para cambiar de actividad.
El "position:sticky" solo puede flotar dentro de los límites de su
propio contenedor — poner el sticky nada más en <nav class="tabs">
no alcanza porque el <aside> que la envuelve mide apenas su alto real
(~140px) y se termina enseguida. Por eso acá el sticky va en el
<aside> completo: al ser más angosto que .main-content queda como
franja fija, con fondo propio, ancla toda la fila de arriba (sesión +
rol + pestañas) mientras se hace scroll por el contenido de abajo. En
PC esto se apaga porque el <aside> ya es "sticky" con su propio look
de panel (ver la regla de acá abajo). */
@media (max-width:879px){
body.theme-bw .sidebar{
position:sticky; top:0; z-index:5;
background:var(--bg);
padding:10px 2px 8px;
margin:0 0 14px;
border-bottom:1px solid var(--borde);
}
}
/* En PC, misma estructura que la sección de escritorio del Ganadero
(ver el bloque "@media (min-width: 880px)" de ganadero/styles.css):
la franja de actividades no es una columna que se desliza junto con
el contenido (sticky, con su propio recuadro) sino una franja FIJA
de punta a punta de la pantalla (position:fixed, ocupa todo el alto),
y el contenido pasa a usar todo el ancho libre en vez de quedar en
una columna angosta centrada. Blanco y negro, como el resto del panel
de Administración — acá solo se copia la estructura de Ganadero, no su
paleta dorada. */
@media (min-width:880px){
body.theme-bw .wrap.wrap-ancho{
max-width:none; margin:0; padding:0 0 0 230px;
}
body.theme-bw .app-layout{ display:block; }
body.theme-bw .sidebar{
position:fixed; left:0; top:0; bottom:0; width:230px;
margin:0; border-radius:0; border:none; border-right:1px solid var(--borde);
padding:24px 16px; overflow-y:auto; background:var(--surface);
}
body.theme-bw .main-content{
max-width:1600px; margin:0 auto; padding:24px 32px 48px;
}
}
</style>
